# Общие настройки сборки.
#
# KOTLIN_VERSION задаётся только в libs.versions.toml — расхождение между
# версией Kotlin и Kotlin/Native ломает cinterop и klib-совместимость.
kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Не тянуть предсобранный Kotlin/Native тулчейн заново, если он уже есть.
kotlin.native.ignoreDisabledTargets=true

# Версия библиотеки (CI может переопределить через -PlibVersion).
libVersion=0.1.0
